services:
  reevectl:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      REEVECTL_PUBLIC_URL: "${REEVECTL_PUBLIC_URL:?set REEVECTL_PUBLIC_URL=https://your-domain.example.com in .env}"
      REEVECTL_ADMIN_USER: "${REEVECTL_ADMIN_USER:-admin}"
      REEVECTL_ADMIN_PASSWORD: "${REEVECTL_ADMIN_PASSWORD:-}"
      REEVECTL_CHECKIN_INTERVAL: "${REEVECTL_CHECKIN_INTERVAL:-30}"
      REEVECTL_LDAP_URL: "${REEVECTL_LDAP_URL:-}"
      REEVECTL_LDAP_USE_SSL: "${REEVECTL_LDAP_USE_SSL:-}"
      REEVECTL_LDAP_BIND_DN: "${REEVECTL_LDAP_BIND_DN:-}"
      REEVECTL_LDAP_BIND_PASSWORD: "${REEVECTL_LDAP_BIND_PASSWORD:-}"
      REEVECTL_LDAP_USER_SEARCH_BASE: "${REEVECTL_LDAP_USER_SEARCH_BASE:-}"
      REEVECTL_LDAP_USER_FILTER: "${REEVECTL_LDAP_USER_FILTER:-(sAMAccountName={username})}"
      REEVECTL_LDAP_ADMIN_GROUP_DN: "${REEVECTL_LDAP_ADMIN_GROUP_DN:-}"
    volumes:
      - reevectl_data:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      REEVECTL_DOMAIN: "${REEVECTL_DOMAIN:?set REEVECTL_DOMAIN=your-domain.example.com in .env}"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - reevectl

volumes:
  reevectl_data:
  caddy_data:
  caddy_config:
